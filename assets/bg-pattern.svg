<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="presentation">
  <title>نمط هندسي عربي خفيف لخلفية الاستوديو</title>

  <!-- شبكة شعرية دقيقة تتكرر بلا حدود -->
  <g stroke="#1f5f96" fill="none" stroke-width="1" opacity="0.06">
    <path d="M0 60h120M60 0v120" />
  </g>

  <!-- أقواس الزوايا: تكتمل دائرةً ناعمة عند تكرار البلاطة -->
  <g stroke="#1f5f96" fill="none" stroke-width="1" opacity="0.07" stroke-linecap="round">
    <path d="M26 0A26 26 0 0 1 0 26" />
    <path d="M120 26A26 26 0 0 0 94 0" />
    <path d="M94 120A26 26 0 0 0 120 94" />
    <path d="M0 94A26 26 0 0 0 26 120" />
  </g>

  <!-- النجمة الثمانية في المركز -->
  <g stroke="#1f5f96" fill="none" stroke-width="1.1" opacity="0.09" stroke-linejoin="round">
    <path d="M60 31l29 29-29 29-29-29z" />
    <path d="M39.5 39.5h41v41h-41z" />
    <path d="M60 49l11 11-11 11-11-11z" />
  </g>

  <!-- معينات ذهبية صغيرة على حدود البلاطة -->
  <g fill="#d9a406" opacity="0.09">
    <path d="M60 -5l5 5-5 5-5-5z" />
    <path d="M60 115l5 5-5 5-5-5z" />
    <path d="M-5 60l5-5 5 5-5 5z" />
    <path d="M115 60l5-5 5 5-5 5z" />
  </g>

  <!-- علامتا استفهام زخرفيتان (متناوبتان على قطر البلاطة) -->
  <g transform="translate(30 30) scale(.82)" opacity="0.09">
    <path d="M-3.6-3.2c0-3.9 7.2-4.6 7.2-.2 0 2.6-3.6 2.4-3.6 5.5" fill="none" stroke="#1f5f96" stroke-width="1.7" stroke-linecap="round" />
    <circle cy="5.6" r="1.35" fill="#d9a406" />
  </g>
  <g transform="translate(90 90) scale(.82)" opacity="0.09">
    <path d="M-3.6-3.2c0-3.9 7.2-4.6 7.2-.2 0 2.6-3.6 2.4-3.6 5.5" fill="none" stroke="#1f5f96" stroke-width="1.7" stroke-linecap="round" />
    <circle cy="5.6" r="1.35" fill="#d9a406" />
  </g>
</svg>
